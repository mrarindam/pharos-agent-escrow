[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
# Deterministic builds make explorer verification reliable.
bytecode_hash = "none"

# Pharos Atlantic testnet — used by `forge script --rpc-url atlantic`.
[rpc_endpoints]
atlantic = "https://atlantic.dplabs-internal.com"
mainnet = "https://rpc.pharos.xyz"
